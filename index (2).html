<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Áo Dài Có Guu</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf7;color:#382b28;font:15px system-ui,sans-serif}header{text-align:center;padding:42px 16px 28px;background:#f5e9e3}h1{font:36px Georgia,serif;margin:12px 0;color:#862e3d}small{letter-spacing:3px}main{max-width:1000px;margin:auto;padding:22px 16px}input,select,button{font:inherit;padding:13px;border:1px solid #dfd3cc;border-radius:10px;background:white}#search{width:100%;margin-bottom:12px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px;margin-top:20px}article{background:white;border:1px solid #eee5df;border-radius:14px;overflow:hidden}img,.placeholder{width:100%;aspect-ratio:3/4;object-fit:cover}.placeholder{display:grid;place-items:center;background:#f0e5df;color:#956d65;font:24px Georgia}section{padding:12px}a,button.primary{display:block;text-align:center;background:#862e3d;color:white;text-decoration:none;padding:12px;border-radius:8px;border:0}button{cursor:pointer}footer{text-align:center;padding:30px;color:#8c7971}dialog{border:1px solid #ddd;border-radius:16px;width:min(92%,440px);max-height:90vh;overflow:auto}dialog input{width:100%;margin:5px 0}label{display:block;margin-top:8px}.muted{color:#8c7971;font-size:13px}.disabled{background:#eee;color:#777;text-align:center;padding:12px;border-radius:8px}.shopee{background:#ee4d2d}.tiktok{background:#161616}.shopee+.tiktok{margin-top:8px}</style></head><body><header><small> TẾT COLLECTION </small><h1>Áo Dài Có Guu</h1><p>Áo dài nàng thương · Duyên dáng ngày xuân</p></header><main><input id="search" placeholder="🔍 Nhập mã áo dài, ví dụ AD01" autocomplete="off"><select id="date"><option value="">Tất cả ngày đăng</option></select> <span id="count" class="muted">Đang tải…</span><p id="status" class="muted" role="status">Đang tải sản phẩm…</p><div id="grid"></div><p id="empty" hidden="">Không tìm thấy áo dài. Bạn hãy kiểm tra lại mã nhé!</p></main><footer>Áo Dài Có Guu · Áo dài collection</footer><script>const $=id=>document.getElementById(id);let items=[];const API='https://script.google.com/macros/s/AKfycbwWkq5SiLkKRiIPEHLFRQSqnEI16Qn64VZpZ33_jSIRUpsbpc4CdsuHSSrGuZpGgpGbEQ/exec';function platform(s){try{let u=new URL(s),h=u.hostname.toLowerCase();if(!['https:','http:'].includes(u.protocol))return '';if(h==='shopee.vn'||h.endsWith('.shopee.vn')||h==='shope.ee'||h.endsWith('.shope.ee')||h==='shopee.com'||h.endsWith('.shopee.com'))return 'shopee';if(h==='tiktok.com'||h.endsWith('.tiktok.com')||h==='tiktokshop.com'||h.endsWith('.tiktokshop.com'))return 'tiktok'}catch{}return ''}function safe(s){return /^(https?:\/\/|data:image\/(png|jpeg|webp|gif);base64,)/i.test(s||'')?s:''}function render(){let d=$('date').value;$('date').replaceChildren(new Option('Tất cả ngày đăng',''));[...new Set(items.map(x=>x.day))].sort().reverse().forEach(x=>$('date').add(new Option(x,x)));$('date').value=d;let q=$('search').value.trim().toLowerCase().replace(/\s/g,'');let found=items.filter(x=>(!d||x.day===d)&&x.code.toLowerCase().includes(q));$('grid').replaceChildren();$('count').textContent=found.length+' sản phẩm';$('empty').hidden=!!found.length;found.forEach(x=>{let a=document.createElement('article'),p=document.createElement(safe(x.photo)?'img':'div');if(safe(x.photo)){p.loading='lazy';p.src=safe(x.photo);p.alt=x.code}else{p.className='placeholder';p.textContent='Áo dài'}a.append(p);let s=document.createElement('section');for(let t of [x.code]){let e=document.createElement('p');e.textContent=t;s.append(e)}let has=false;for(let [url,label,cls] of [[x.link||x.tiktok,platform(x.link||x.tiktok)==='tiktok'?'Mua trên TikTok':'Mua trên Shopee',platform(x.link||x.tiktok)]]){if(cls){let b=document.createElement('a');b.textContent=label;b.className=cls;b.href=url;b.target='_blank';b.rel='noopener sponsored';s.append(b);has=true}}if(!has){let b=document.createElement('div');b.className='disabled';b.textContent='Chưa có link mua';s.append(b)};a.append(s);$('grid').append(a)})}
$('search').oninput=render;$('date').onchange=render;
let pending=false,loaded=false,timer;
window.receiveCatalog=function(data){if(!Array.isArray(data))return;clearTimeout(timer);pending=false;loaded=true;items=data.filter(x=>x&&typeof x.code==='string').sort((a,b)=>String(b.day).localeCompare(String(a.day)));render();$('status').textContent='';};
function refresh(){if(pending)return;pending=true;let tag=document.createElement('script');function fail(){clearTimeout(timer);pending=false;tag.remove();$('status').textContent='Chưa tải được dữ liệu. Website sẽ thử lại.';}tag.onerror=fail;tag.onload=()=>{tag.remove();if(pending)fail()};timer=setTimeout(fail,25000);tag.src=API+'?t='+Date.now();document.head.append(tag);}
refresh();setInterval(refresh,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
