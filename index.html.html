<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Áo Dài Có Guu</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfaf7;color:#382b28;font:15px system-ui,sans-serif}header{text-align:center;padding:42px 16px 28px;background:#f5e9e3}h1{font:36px Georgia,serif;margin:12px 0;color:#862e3d}small{letter-spacing:3px}main{max-width:1000px;margin:auto;padding:22px 16px}input,select,button{font:inherit;padding:13px;border:1px solid #dfd3cc;border-radius:10px;background:white}#search{width:100%;margin-bottom:12px}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px;margin-top:20px}article{background:white;border:1px solid #eee5df;border-radius:14px;overflow:hidden}img,.placeholder{width:100%;aspect-ratio:3/4;object-fit:cover}.placeholder{display:grid;place-items:center;background:#f0e5df;color:#956d65;font:24px Georgia}section{padding:12px}a,button.primary{display:block;text-align:center;background:#862e3d;color:white;text-decoration:none;padding:12px;border-radius:8px;border:0}button{cursor:pointer}footer{text-align:center;padding:30px;color:#8c7971}dialog{border:1px solid #ddd;border-radius:16px;width:min(92%,440px);max-height:90vh;overflow:auto}dialog input{width:100%;margin:5px 0}label{display:block;margin-top:8px}.muted{color:#8c7971;font-size:13px}.disabled{background:#eee;color:#777;text-align:center;padding:12px;border-radius:8px}.shopee{background:#ee4d2d}.tiktok{background:#161616}.shopee+.tiktok{margin-top:8px}</style><header><small> TẾT COLLECTION </small><h1>Áo Dài Có Guu</h1><p>Áo dài nàng thương · Duyên dáng ngày xuân</p></header><main><input id="search" placeholder="🔍 Nhập mã áo dài, ví dụ AD01" autocomplete="off"><select id="date"><option value="">Tất cả ngày đăng</option></select> <span id="count" class="muted"></span><div id="grid"></div><p id="empty" hidden>Không tìm thấy áo dài. Bạn hãy kiểm tra lại mã nhé!</p></main><footer> Áo Dài Có Guu · Áo dài collection <p><button id="manage">Quản lý sản phẩm (bản mẫu)</button></p></footer><dialog id="editor"><h2>Quản lý sản phẩm</h2><p class="muted">Thay đổi chỉ lưu trên trình duyệt này. Xuất website để cập nhật bản công khai.</p><form id="form"><label>Mã sản phẩm<input id="code" required placeholder="AD01"></label><label>Tên áo dài<input id="name" required></label><label>Ngày đăng<input id="day" type="date" required></label><label>Link ảnh công khai<input id="photo" type="url"></label><label>Hoặc chọn ảnh từ máy<input id="upload" type="file" accept="image/*"></label><label>Link mua hàng Affiliate (Shopee hoặc TikTok)<input id="link" type="url" required placeholder="https://..."></label><button class="primary" type="submit">Lưu sản phẩm</button></form><p><button id="remove">Xóa theo mã</button> <button id="export">Xuất website HTML</button> <button id="close">Đóng</button></p></dialog><script id="catalog" type="application/json">[{"code":"AD01","name":"Áo dài mẫu 01","day":"2026-11-23","photo":"","link":""},{"code":"AD02","name":"Áo dài mẫu 02","day":"2026-11-23","photo":"","link":""}]</script><script>const $=id=>document.getElementById(id);let items=JSON.parse($('catalog').textContent);try{items=JSON.parse(localStorage.getItem('aodai-v1')||'null')||items}catch{};function platform(s){try{let u=new URL(s),h=u.hostname.toLowerCase();if(!['https:','http:'].includes(u.protocol))return '';if(h==='shopee.vn'||h.endsWith('.shopee.vn')||h==='shope.ee'||h.endsWith('.shope.ee')||h==='shopee.com'||h.endsWith('.shopee.com'))return 'shopee';if(h==='tiktok.com'||h.endsWith('.tiktok.com')||h==='tiktokshop.com'||h.endsWith('.tiktokshop.com'))return 'tiktok'}catch{}return ''}function safe(s){return /^(https?:\/\/|data:image\/(png|jpeg|webp|gif);base64,)/i.test(s||'')?s:''}function render(){let d=$('date').value;$('date').replaceChildren(new Option('Tất cả ngày đăng',''));[...new Set(items.map(x=>x.day))].sort().reverse().forEach(x=>$('date').add(new Option(x,x)));$('date').value=d;let q=$('search').value.trim().toLowerCase().replace(/\s/g,'');let found=items.filter(x=>(!d||x.day===d)&&x.code.toLowerCase().includes(q));$('grid').replaceChildren();$('count').textContent=found.length+' sản phẩm';$('empty').hidden=!!found.length;found.forEach(x=>{let a=document.createElement('article'),p=document.createElement(safe(x.photo)?'img':'div');if(safe(x.photo)){p.src=safe(x.photo);p.alt=x.name}else{p.className='placeholder';p.textContent='Áo dài'}a.append(p);let s=document.createElement('section');for(let t of [x.code,x.name]){let e=document.createElement('p');e.textContent=t;s.append(e)}let has=false;for(let [url,label,cls] of [[x.link||x.tiktok,platform(x.link||x.tiktok)==='tiktok'?'Mua trên TikTok':'Mua trên Shopee',platform(x.link||x.tiktok)]]){if(cls){let b=document.createElement('a');b.textContent=label;b.className=cls;b.href=url;b.target='_blank';b.rel='noopener sponsored';s.append(b);has=true}}if(!has){let b=document.createElement('div');b.className='disabled';b.textContent='Chưa có link mua';s.append(b)};a.append(s);$('grid').append(a)})}function save(){try{localStorage.setItem('aodai-v1',JSON.stringify(items))}catch{alert('Bộ nhớ đầy. Hãy xuất website để lưu.')}render()}$('search').oninput=render;$('date').onchange=render;$('manage').onclick=()=>{$('day').value=new Date().toISOString().slice(0,10);$('editor').showModal()};$('close').onclick=()=>$('editor').close();$('code').onchange=()=>{let x=items.find(x=>x.code===$('code').value.trim().toUpperCase());if(x){for(let k of ['name','day','photo','link'])$(k).value=(x[k]||'').startsWith('data:')?'':(x[k]||'');$('link').value=x.link||x.tiktok||''}};$('form').onsubmit=async e=>{e.preventDefault();if(!platform($('link').value)){alert('Vui lòng nhập link Shopee hoặc TikTok hợp lệ.');return}let code=$('code').value.trim().toUpperCase(),old=items.find(x=>x.code===code),photo=$('photo').value||old?.photo||'';let f=$('upload').files[0];if(f)photo=await new Promise(r=>{let a=new FileReader;a.onload=()=>r(a.result);a.readAsDataURL(f)});items=items.filter(x=>x.code!==code);items.unshift({code,name:$('name').value,day:$('day').value,photo,link:$('link').value});save();$('form').reset();$('editor').close()};$('remove').onclick=()=>{if(confirm('Xóa mã này?')){items=items.filter(x=>x.code!==$('code').value.trim().toUpperCase());save()}};$('export').onclick=()=>{let doc=document.documentElement.cloneNode(true);doc.querySelector('#catalog').textContent=JSON.stringify(items).replace(/</g,'\\u003c');doc.querySelector('#grid').replaceChildren();doc.querySelector('#editor').removeAttribute('open');doc.querySelector('#manage').hidden=true;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>'+doc.outerHTML],{type:'text/html'}));a.download='index.html';a.click()};render();</script></html>
